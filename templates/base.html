<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <style>
        :root {
            --bg: #0b1120;
            --bg-alt: #111827;
            --card: #020617;
            --border: #1f2937;
            --accent: #38bdf8;
            --accent-soft: #0ea5e9;
            --text: #e5e7eb;
            --text-muted: #9ca3af;
            --danger: #f97373;
            --success: #4ade80;
            --warning: #facc15;
            --gold: #f5d76e;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: radial-gradient(circle at top, #0f172a 0, #020617 45%, #000 100%);
            color: var(--text);
        }

        header {
            background: linear-gradient(90deg, #020617, #0a1a2f);
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: flex-start;
            position: relative;
        }

        header .title {
            font-size: 24px;
            font-weight: 700;
            color: var(--gold);
            letter-spacing: 0.05em;
            text-shadow: 0 0 8px rgba(245, 215, 110, 0.4);
        }

        header .nav {
            position: absolute;
            right: 24px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            gap: 16px;
            font-size: 14px;
            align-items: center;
        }

        header .nav a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
        }

        header .nav a.logout {
            color: var(--danger);
        }

        #error-banner {
            display: none;
            margin: 12px 24px 0;
            padding: 10px 14px;
            border-radius: 8px;
            background: rgba(248, 113, 113, 0.1);
            border: 1px solid rgba(248, 113, 113, 0.4);
            color: var(--danger);
            font-size: 13px;
        }

        #dashboard-content {
            padding: 20px 24px 32px;
        }
    </style>
</head>
<body>

<header>
    <div class="title">{{ title }}</div>

    <div class="nav">
        <span id="header-account" style="color: var(--accent-soft); font-weight: 600;">
            Funds: {{ account.funds|default('—') }} ·
            Balance: {{ account.balance|default('—') }} ·
            PnL: {{ account.pnl|default('—') }} ·
            Available: {{ account.available|default('—') }} ·
            Margin: {{ account.margin|default('—') }}
        </span>

        <a href="/dashboard">Dashboard</a>
        <a href="/dashboard/logout" class="logout">Logout</a>
    </div>
</header>

<div id="error-banner"></div>

<div id="dashboard-content">
    {% block content %}{% endblock %}
</div>

<script>
function refreshDashboard() {
    const errorBanner = document.getElementById('error-banner');

    fetch('/dashboard/data')
        .then(r => r.json())
        .then(data => {
            if (data && data.html) {
                const container = document.getElementById('dashboard-inner');
                if (container) {
                    container.innerHTML = data.html;
                }

                // 🔥 Update header balance live
                const header = document.getElementById('header-account');
                if (header && data.account) {
                    header.innerHTML =
                        `Funds: ${data.account.funds ?? '—'} · ` +
                        `Balance: ${data.account.balance ?? '—'} · ` +
                        `PnL: ${data.account.pnl ?? '—'} · ` +
                        `Available: ${data.account.available ?? '—'} · ` +
                        `Margin: ${data.account.margin ?? '—'}`;
                }

            } else {
                errorBanner.innerText = "Dashboard refresh failed: Invalid response.";
                errorBanner.style.display = "block";
            }
        })
        .catch(err => {
            errorBanner.innerText = "Dashboard refresh error: " + err;
            errorBanner.style.display = "block";
        });
}

setInterval(refreshDashboard, 5000);

function closePosition(id) {
    if (!id) return;
    window.location.href = "/dashboard/close/" + id;
}
</script>

</body>
</html>
