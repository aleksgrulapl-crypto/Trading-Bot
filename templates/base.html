<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <style>
        :root {
            --bg: #0b1120;
            --bg-alt: #111827;
            --card: #020617;
            --border: #1f2937;
            --accent: #38bdf8;
            --accent-soft: #0ea5e9;
            --text: #e5e7eb;
            --text-muted: #9ca3af;
            --danger: #f97373;
            --success: #4ade80;
            --warning: #facc15;
            --gold: #f5d76e; /* NEW GOLD COLOR */
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: radial-gradient(circle at top, #0f172a 0, #020617 45%, #000 100%);
            color: var(--text);
        }

        /* ============================
           HEADER — GOLDEN CENTERED TITLE
           ============================ */
        header {
            background: linear-gradient(90deg, #020617, #0a1a2f);
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center; /* CENTER TITLE */
            position: relative; /* allows nav to float right */
        }

        header .title {
            font-size: 24px;
            font-weight: 700;
            color: var(--gold); /* GOLD TITLE */
            letter-spacing: 0.05em;
            text-shadow: 0 0 8px rgba(245, 215, 110, 0.4);
        }

        /* NAV stays top-right */
        header .nav {
            position: absolute;
            right: 24px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            gap: 16px;
            font-size: 14px;
        }

        header .nav a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
        }

        header .nav a.logout {
            color: var(--danger);
        }

        #error-banner {
            display: none;
            margin: 12px 24px 0;
            padding: 10px 14px;
            border-radius: 8px;
            background: rgba(248, 113, 113, 0.1);
            border: 1px solid rgba(248, 113, 113, 0.4);
            color: var(--danger);
            font-size: 13px;
        }

        #dashboard-content {
            padding: 20px 24px 32px;
        }

        .grid {
            display: grid;
            grid-template-columns: minmax(0, 2fr) minmax(0, 3fr);
            gap: 16px;
        }

        .grid-full {
            margin-top: 16px;
        }

        .card {
            background: rgba(15, 23, 42, 0.9);
            border-radius: 12px;
            border: 1px solid rgba(31, 41, 55, 0.9);
            padding: 14px 16px;
            box-shadow: 0 18px 40px rgba(15, 23, 42, 0.7);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 10px;
        }

        .card-title {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .card-subtitle {
            font-size: 12px;
            color: var(--accent-soft);
        }

        .metrics-row {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 10px;
            margin-top: 8px;
        }

        .metric {
            padding: 8px 10px;
            border-radius: 8px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(31, 41, 55, 0.8);
        }

        .metric-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .metric-value {
            margin-top: 4px;
            font-size: 15px;
            font-weight: 600;
        }

        .metric-good {
            color: var(--success);
        }

        .metric-bad {
            color: var(--danger);
        }

        .metric-neutral {
            color: var(--accent);
        }

        .table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        .table th,
        .table td {
            padding: 6px 8px;
            border-bottom: 1px solid rgba(31, 41, 55, 0.7);
        }

        .table th {
            text-align: left;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted);
            background: rgba(15, 23, 42, 0.9);
        }

        .table tr:hover td {
            background: rgba(15, 23, 42, 0.7);
        }

        .pill {
            display: inline-flex;
            align-items: center;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 11px;
        }

        .pill-long {
            background: rgba(34, 197, 94, 0.1);
            color: var(--success);
            border: 1px solid rgba(34, 197, 94, 0.4);
        }

        .pill-short {
            background: rgba(248, 113, 113, 0.1);
            color: var(--danger);
            border: 1px solid rgba(248, 113, 113, 0.4);
        }

        .pill-status {
            background: rgba(56, 189, 248, 0.08);
            color: var(--accent-soft);
            border: 1px solid rgba(56, 189, 248, 0.4);
        }

        .pnl-pos {
            color: var(--success);
        }

        .pnl-neg {
            color: var(--danger);
        }

        .small {
            font-size: 11px;
            color: var(--text-muted);
        }

        @media (max-width: 1024px) {
            .grid {
                grid-template-columns: minmax(0, 1fr);
            }
        }
    </style>
</head>
<body>

<header>
    <div class="title">{{ title }}</div>

    <div class="nav">
        <a href="/dashboard">Dashboard</a>
        <a href="/dashboard/logout" class="logout">Logout</a>
    </div>
</header>

<div id="error-banner"></div>

<div id="dashboard-content">
    {% block content %}{% endblock %}
</div>

<script>
function refreshDashboard() {
    const errorBanner = document.getElementById('error-banner');

    fetch('/dashboard/data')
        .then(r => r.json())
        .then(data => {
            if (data && data.html) {
                const container = document.getElementById('dashboard-inner');
                if (container) {
                    container.innerHTML = data.html;
                }
            } else {
                errorBanner.innerText = "Dashboard refresh failed: Invalid response.";
                errorBanner.style.display = "block";
            }
        })
        .catch(err => {
            errorBanner.innerText = "Dashboard refresh error: " + err;
            errorBanner.style.display = "block";
        });
}

setInterval(refreshDashboard, 5000);

function closePosition(id) {
    if (!id) return;
    window.location.href = "/dashboard/close/" + id;
}
</script>

</body>
</html>
