<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ title }} - {{ cache_bust }}</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Force browser to reload CSS -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <style data-version="{{ cache_bust }}">
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #161b22;
            padding: 20px 30px;
            border-bottom: 1px solid #21262d;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            flex: 1;
            text-align: center;
            margin: 0;
            font-size: 26px;
            font-weight: bold;
            color: #c9d1d9;
        }

        nav a {
            color: #58a6ff;
            text-decoration: none;
            font-weight: bold;
            margin-left: 20px;
        }

        nav a.logout {
            color: #ff4d4d;
        }

        #dashboard-content {
            padding: 25px;
        }

        #error-banner {
            background: #3b0000;
            color: #ff6b6b;
            padding: 12px;
            text-align: center;
            display: none;
            margin: 10px 25px;
            border-radius: 6px;
            font-size: 14px;
        }

        .section { margin-bottom: 30px; }

        .section-title {
            margin-bottom: 15px;
            font-size: 20px;
            font-weight: bold;
            color: #c9d1d9;
        }

        .card {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #333;
            margin-bottom: 25px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .warning-box {
            padding: 10px;
            background: #332200;
            color: yellow;
            border: 1px solid yellow;
            margin-top: 10px;
            border-radius: 6px;
        }

        .position-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 15px;
        }

        .position-card {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #333;
            transition: transform 0.15s ease;
        }

        .position-card:hover {
            transform: translateY(-3px);
        }

        .pos-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .ticker { font-size: 1.2em; font-weight: bold; }

        .side.BUY { color: #00ff99; }
        .side.SELL { color: #ff4d4d; }

        .pnl.green { color: #00ff99; }
        .pnl.red { color: #ff4d4d; }

        .close-btn {
            margin-top: 12px;
            width: 100%;
            padding: 10px;
            background: #ff4d4d;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            color: #fff;
        }

        .trade-table {
            width: 100%;
            border-collapse: collapse;
        }

        .trade-table th, .trade-table td {
            padding: 10px;
            border-bottom: 1px solid #333;
        }

        .trade-table th {
            background: #161b22;
        }

        .green { color: #00ff99; }
        .red { color: #ff4d4d; }
    </style>
</head>

<body>

<header>
    <h1>{{ title }}</h1>
    <nav>
        <a href="/dashboard">Dashboard</a>
        <a href="/dashboard/logout" class="logout">Logout</a>
    </nav>
</header>

<div id="error-banner"></div>

<div id="dashboard-content">
    {% block content %}{% endblock %}
</div>

<script>
function refreshDashboard() {
    const errorBanner = document.getElementById('error-banner');

    fetch('/dashboard/data')
        .then(response => response.json())
        .then(data => {
            if (data && data.html) {
                // ⭐ FIXED: Replace dashboard-inner, not dashboard-content
                const container = document.getElementById('dashboard-inner');
                if (container) {
                    container.innerHTML = data.html;
                }
            } else {
                errorBanner.innerText = "Dashboard refresh failed: Invalid response.";
                errorBanner.style.display = "block";
            }
        })
        .catch(err => {
            errorBanner.innerText = "Dashboard refresh error: " + err;
            errorBanner.style.display = "block";
        });
}

setInterval(refreshDashboard, 5000);

function closePosition(id) {
    if (!id) return;
    window.location.href = "/dashboard/close/" + id;
}
</script>

</body>
</html>
