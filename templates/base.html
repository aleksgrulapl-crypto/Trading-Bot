<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <style>
        :root {
            --bg: #0b1120;
            --bg-alt: #111827;
            --card: #020617;
            --border: #1f2937;
            --accent: #38bdf8;
            --accent-soft: #0ea5e9;
            --text: #e5e7eb;
            --text-muted: #9ca3af;
            --danger: #f97373;
            --success: #4ade80;
            --warning: #facc15;
            --gold: #f5d76e;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: radial-gradient(circle at top, #0f172a 0, #020617 45%, #000 100%);
            color: var(--text);
        }
        header {
            background: linear-gradient(90deg, #020617, #0a1a2f);
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
            align-items: center;
            gap: 24px;
        }
        header .title {
            font-size: 24px;
            font-weight: 700;
            color: var(--accent-soft);
            letter-spacing: 0.05em;
            text-shadow: 0 0 8px rgba(14, 165, 233, 0.4);
            white-space: nowrap;
        }
        header .uk-clock {
            color: var(--accent-soft);
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-align: center;
            white-space: nowrap;
        }
        header .uk-clock-label {
            color: var(--text-muted);
            display: block;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.12em;
            margin-bottom: 3px;
            text-transform: uppercase;
        }
        header .header-right {
            align-items: flex-end;
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 0;
        }
        header .nav {
            display: flex;
            gap: 16px;
            font-size: 14px;
            align-items: center;
        }
        header .nav a { color: var(--accent); text-decoration: none; font-weight: 500; }
        header .nav a.logout { color: var(--danger); }
        #error-banner {
            display: none;
            margin: 12px 24px 0;
            padding: 10px 14px;
            border-radius: 8px;
            background: rgba(248, 113, 113, 0.1);
            border: 1px solid rgba(248, 113, 113, 0.4);
            color: var(--danger);
            font-size: 13px;
        }
        #dashboard-content { padding: 20px 24px 32px; }
        .grid { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 16px; }
        .grid-full { display: grid; grid-template-columns: 1fr; margin: 0 auto; max-width: 1200px; }
        .card { background: rgba(15, 23, 42, 0.9); border-radius: 12px; border: 1px solid rgba(31, 41, 55, 0.9); padding: 14px 16px; box-shadow: 0 18px 40px rgba(15, 23, 42, 0.7); }
        .card-header { 
            display: flex; 
            justify-content: center;
            align-items: center;
            margin-bottom: 14px;
            position: relative;
        }
        .card-title { 
            font-size: 14px; 
            font-weight: 600; 
            letter-spacing: 0.04em; 
            text-transform: uppercase; 
            color: var(--accent);
            padding: 0 12px;
            border-bottom: 2px solid var(--accent);
            display: inline-block;
            white-space: nowrap;
        }
        .card-subtitle { font-size: 12px; color: var(--accent-soft); }
        .metrics-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 8px; }
        .metric { padding: 8px 10px; border-radius: 8px; background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(31, 41, 55, 0.8); }
        .metric-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; }
        .metric-value { margin-top: 4px; font-size: 15px; font-weight: 600; }
        .metric-good { color: var(--success); }
        .metric-bad { color: var(--danger); }
        .metric-neutral { color: var(--accent); }
        .table { width: 100%; border-collapse: collapse; font-size: 12px; }
        .table th, .table td { padding: 6px 8px; border-bottom: 1px solid rgba(31, 41, 55, 0.7); }
        .table th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); background: rgba(15, 23, 42, 0.9); }
        .table tbody tr:hover { background: rgba(31, 41, 55, 0.3); }
        .pill { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 500; }
        .pill-long { background: rgba(34, 197, 94, 0.1); color: var(--success); border: 1px solid rgba(34, 197, 94, 0.4); }
        .pill-short { background: rgba(248, 113, 113, 0.1); color: var(--danger); border: 1px solid rgba(248, 113, 113, 0.4); }
        .pill-status { background: rgba(56, 189, 248, 0.1); color: var(--accent); border: 1px solid rgba(56, 189, 248, 0.4); cursor: pointer; }
        .pill-status:hover { background: rgba(56, 189, 248, 0.2); }
        .pnl-pos { color: var(--success); font-weight: 600; }
        .pnl-neg { color: var(--danger); font-weight: 600; }
        .small { font-size: 11px; color: var(--text-muted); }
        button {
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent);
            border: 1px solid rgba(56, 189, 248, 0.4);
            padding: 4px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 500;
            transition: all 0.2s;
        }
        button:hover {
            background: rgba(56, 189, 248, 0.2);
            border-color: rgba(56, 189, 248, 0.6);
        }
        button.button-danger {
            background: rgba(249, 115, 115, 0.12);
            color: var(--danger);
            border-color: rgba(249, 115, 115, 0.45);
        }
        button.button-danger:hover {
            background: rgba(249, 115, 115, 0.2);
            border-color: rgba(249, 115, 115, 0.65);
        }
        @media (max-width: 1024px) {
            header {
                grid-template-columns: 1fr auto;
            }
            header .uk-clock {
                grid-column: 1 / -1;
                grid-row: 2;
            }
            .grid { grid-template-columns: minmax(0, 1fr); }
        }
        @media (max-width: 720px) {
            header {
                grid-template-columns: 1fr;
                text-align: center;
            }
            header .title { white-space: normal; }
            header .uk-clock {
                grid-column: 1;
                grid-row: auto;
            }
            header .header-right { align-items: center; }
            header .nav { flex-wrap: wrap; justify-content: center; }
        }
    </style>
</head>
<body>

<header>
    <div class="title">{{ title }}</div>

    <div id="uk-clock" class="uk-clock" aria-live="off">
        <span class="uk-clock-label">UK Time</span>
        <span id="uk-clock-value">--:--:--</span>
    </div>

    <div class="header-right">
        <span id="header-account" style="color: var(--accent-soft); font-weight: 600;">
            Equity: {{ account.equity|default('—') }} ·
            Balance: {{ account.balance|default('—') }} ·
            PnL:
            <span style="font-weight:700; color:{% if account.pnl is not none and account.pnl >= 0 %}var(--success){% else %}var(--danger){% endif %};">
                {{ account.pnl|default('—') }}
            </span>
            · Available: {{ account.available|default('—') }}
        </span>

        <div class="nav">
            <a href="/dashboard">Dashboard</a>
            <a href="/dashboard/logout" class="logout">Logout</a>
        </div>
    </div>
</header>

<div id="error-banner"></div>

<div id="dashboard-content">
    {% block content %}{% endblock %}
</div>

<script>
let isFirstLoad = true;

function updateUkClock() {
    const clock = document.getElementById('uk-clock-value');
    if (!clock) return;
    clock.textContent = new Intl.DateTimeFormat('en-GB', {
        timeZone: 'Europe/London',
        weekday: 'short',
        day: '2-digit',
        month: 'short',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: false
    }).format(new Date());
}

function closePosition(dealId) {
    const errorBanner = document.getElementById('error-banner');

    fetch(`/dashboard/close/${encodeURIComponent(dealId)}`, { method: "POST" })
        .then(r => r.json())
        .then(data => {
            errorBanner.innerText = (data && data.message) || "Close action is disabled.";
            errorBanner.style.display = "block";
            refreshDashboard();
        })
        .catch(err => console.error("Close error:", err));
}

function deleteTrade(tradeIndex) {
    const errorBanner = document.getElementById('error-banner');
    if (!window.confirm('Delete this trade from the log?')) {
        return;
    }

    fetch(`/dashboard/trade/${encodeURIComponent(tradeIndex)}/delete`, { method: "POST" })
        .then(r => r.json())
        .then(data => {
            errorBanner.innerText = (data && data.message) || "Delete action failed.";
            errorBanner.style.display = "block";
            refreshDashboard();
        })
        .catch(err => console.error("Delete trade error:", err));
}

function refreshDashboard() {
    const errorBanner = document.getElementById('error-banner');

    fetch('/dashboard/data?_=' + Date.now())
        .then(r => {
            if (!r.ok) throw new Error(`HTTP ${r.status}`);
            return r.json();
        })
        .then(data => {
            if (data && data.html) {
                const container = document.getElementById('dashboard-inner');
                if (container) {
                    container.innerHTML = data.html;
                }
                const header = document.getElementById('header-account');
                if (header && data.account) {
                    const pnl = data.account.pnl;
                    const pnlColor = (pnl !== null && pnl !== undefined && pnl >= 0) ? 'var(--success)' : 'var(--danger)';
                    header.innerHTML =
                        `Equity: ${data.account.equity ?? '—'} · ` +
                        `Balance: ${data.account.balance ?? '—'} · ` +
                        `PnL: <span style="font-weight:700; color:${pnlColor}">` +
                        `${pnl ?? '—'}</span> · ` +
                        `Available: ${data.account.available ?? '—'}`;
                }
                errorBanner.style.display = "none";
            } else if (data && data.error) {
                errorBanner.innerText = `Dashboard refresh failed: ${data.message || 'Unknown error'}`;
                errorBanner.style.display = "block";
            } else {
                errorBanner.innerText = "Dashboard refresh failed: Invalid response.";
                errorBanner.style.display = "block";
            }
        })
        .catch(err => {
            errorBanner.innerText = "Dashboard refresh error: " + err.message;
            errorBanner.style.display = "block";
        });
}

updateUkClock();
setInterval(updateUkClock, 1000);

// Start refreshing after 8 seconds on first load, then every 5 seconds
if (isFirstLoad) {
    setTimeout(() => {
        refreshDashboard();
        isFirstLoad = false;
        setInterval(refreshDashboard, 5000);
    }, 8000);
}
</script>

</body>
</html>
