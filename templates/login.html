<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#0b1f4d">
    <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
    <script>if ("serviceWorker" in navigator) { window.addEventListener("load", function () { navigator.serviceWorker.register("/sw.js").catch(function () {}); }); }</script>
    <title>AGC Trader - Login</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            background-color: #161b22;
            padding: 30px;
            border-radius: 8px;
            width: 320px;
            text-align: center;
            box-shadow: 0 0 10px #000;
        }
        input[type="password"], input[type="text"], input[type="email"] {
            width: 90%;
            padding: 10px;
            margin-top: 15px;
            border-radius: 5px;
            border: none;
            background-color: #21262d;
            color: #c9d1d9;
        }
        select {
            width: 96%;
            padding: 10px;
            margin-top: 15px;
            border-radius: 5px;
            border: none;
            background-color: #21262d;
            color: #c9d1d9;
            font-size: 14px;
        }
        button {
            margin-top: 20px;
            padding: 10px 20px;
            width: 100%;
            background-color: #238636;
            border: none;
            border-radius: 5px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        .error {
            color: #ff7b72;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="login-box">
    <h2>AGC Trader</h2>
    <p>Sign in to the Dashboard</p>

    <form method="POST">
        <input type="text" name="username" placeholder="Email address" value="{{ username|default('') }}" autocomplete="username" required>
        <input type="password" name="password" placeholder="Password" autocomplete="current-password" required>
        <button type="submit">Login</button>
    </form>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}
    {% if notice %}
        <div style="color:#3fb950; margin-top:10px;">{{ notice }}</div>
    {% endif %}

    <p style="margin-top:15px; font-size:13px;"><a href="/dashboard/forgot" style="color:#58a6ff;">Forgot password?</a></p>
    <p style="margin-top:10px; font-size:13px;">
        No account yet? <a href="/dashboard/register" style="color:#58a6ff;">Create one</a>
        &middot; <a href="/dashboard/terms" style="color:#58a6ff;">Terms</a>
    </p>
    {% include "_auth_footer.html" %}
</div>

</body>
</html>
